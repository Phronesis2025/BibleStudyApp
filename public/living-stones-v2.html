<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Living Stones Earnings Call: an earnings presentation whose charts are cut from rolling stone.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Living Stones Earnings Call</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a presentation. The slide (a WebGL slate with the slide title set into its top-left corner)
   fills the left; a presenter panel on the right holds the agenda, the prepared remarks, the figures
   and the transport. On a narrow screen the panel drops beneath the slide. Every corner is square. */
:root {
  color-scheme: dark;
  --ink: #06080a;
  --panel: #0c0f10;
  --panel-2: #14181a;
  --rule: #272d2e;
  --text: #dce0de;
  --muted: #8a9290;
  --teal: #38d8c4;
  --teal-deep: #0e8576;
  --granite: #7f8686;
  --lime: #cfc9b8;
  --rust: #d2714f;
  --font-ui: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
html, body { height: 100%; }
body {
  background: var(--ink);
  color: var(--text);
  font-family: var(--font-ui);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; border-radius: 0; }
.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 372px; grid-template-rows: minmax(0, 1fr); }

/* ---- the slide ---- */
.stage {
  position: relative; min-width: 0; min-height: 0; overflow: hidden;
  background: var(--ink);
  touch-action: none; user-select: none; -webkit-user-select: none;
}
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
.slidehead {
  position: absolute; top: 14px;
  left: max(16px, env(safe-area-inset-left, 0px));
  right: 16px;
  pointer-events: none;
  display: flex; flex-direction: column; gap: 6px;
}
.brand {
  margin: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text);
}
.brand .mark { width: 10px; height: 10px; border: 2px solid var(--teal); box-sizing: border-box; }
.brand span:last-child { color: var(--muted); font-weight: 500; }
.eyebrow { margin: 6px 0 0; font-size: 0.75rem; letter-spacing: 0.04em; color: var(--muted); }
.slidehead h1 {
  margin: 0; max-width: 30ch;
  font-weight: 600; font-size: clamp(1.125rem, 0.85rem + 1.25vw, 1.75rem); line-height: 1.16; letter-spacing: -0.005em;
  color: var(--text); text-wrap: balance;
}
.slidehead h1 b { font-weight: 700; color: var(--teal); font-variant-numeric: tabular-nums; }
.legend { margin: 2px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 0.75rem; color: var(--muted); }
.legend li { display: flex; align-items: center; gap: 6px; }
.legend i { width: 9px; height: 9px; display: block; }
.legend .s-turq { background: var(--teal); } .legend .s-granite { background: var(--granite); }
.legend .s-lime { background: var(--lime); } .legend .s-rust { background: var(--rust); }
.eyebrow, .slidehead h1, .legend, .script, .speaker { transition: opacity 0.25s ease; }
.swapping .eyebrow, .swapping h1, .swapping .legend, .swapping.remarks .script, .swapping.remarks .speaker { opacity: 0; }
.fallback {
  position: absolute; inset: 0; margin: auto; height: max-content; max-width: 38ch;
  padding-inline: 16px; text-align: center; font-size: 0.9375rem; line-height: 1.5; color: var(--muted);
}

/* labels projected from the scene */
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; transition: opacity 0.25s ease; }
.labels.swap { opacity: 0; }
.labels span {
  position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform;
  transition: opacity 0.3s ease; text-align: center; line-height: 1.15;
  text-shadow: 0 1px 8px var(--ink), 0 0 2px var(--ink);
}
.labels .val { font-family: var(--font-num); font-weight: 500; font-size: clamp(0.6875rem, 0.55rem + 0.55vw, 0.9375rem); color: var(--text); }
.labels .val.hi { color: var(--teal); }
.labels .val.neg { color: var(--rust); }
.labels .cat { font-weight: 500; font-size: clamp(0.5625rem, 0.42rem + 0.6vw, 0.8125rem); color: var(--text); }
.labels .note { font-weight: 600; font-size: clamp(0.625rem, 0.5rem + 0.5vw, 0.8125rem); color: var(--text); }
.labels .note.hi { color: var(--teal); } .labels .note.neg { color: var(--rust); }
.labels .tick { font-family: var(--font-num); font-size: clamp(0.5625rem, 0.5rem + 0.25vw, 0.6875rem); color: var(--muted); }
.labels.close span:not(.focus) { opacity: 0 !important; }

/* ---- presenter panel ---- */
.deck {
  min-width: 0; min-height: 0; overflow-y: auto;
  background: var(--panel); border-left: 1px solid var(--rule);
  padding-block: 16px 14px;
  padding-left: 18px; padding-right: max(18px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
.agenda { margin: 0; padding: 0; list-style: none; display: grid; gap: 0; border: 1px solid var(--rule); }
.agenda li + li { border-top: 1px solid var(--rule); }
.agenda button {
  width: 100%; display: grid; grid-template-columns: 2.2em minmax(0, 1fr); align-items: baseline; gap: 4px;
  padding: 8px 10px; background: transparent; border: 0; text-align: left; cursor: pointer;
  font-size: 0.8125rem; color: var(--muted);
}
.agenda button .n { font-family: var(--font-num); font-size: 0.6875rem; }
.agenda button:hover { color: var(--text); }
.agenda button[aria-current="step"] { background: var(--panel-2); color: var(--text); font-weight: 600; box-shadow: inset 2px 0 0 var(--teal); }
.agenda button[aria-current="step"] .n { color: var(--teal); }
.remarks { display: flex; flex-direction: column; gap: 6px; min-height: 0; }
.speaker { margin: 0; font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--teal); }
.script { margin: 0; font-size: 0.9375rem; line-height: 1.5; color: var(--text); max-width: 46ch; }
.script b { font-weight: 600; color: var(--teal); font-variant-numeric: tabular-nums; }
.progress { height: 2px; background: var(--rule); }
.progress i { display: block; height: 100%; width: 0; background: var(--teal); }
.figures { display: flex; flex-direction: column; gap: 8px; }
.figures-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.figures-head h2 { margin: 0; font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.sliders { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px 18px; }
.cell { display: grid; grid-template-columns: 7.2em minmax(0, 1fr) 3.6em; align-items: center; gap: 10px; min-width: 0; }
.cell label { font-size: 0.8125rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell output { font-family: var(--font-num); font-size: 0.75rem; text-align: right; color: var(--teal); }
input[type="range"] { -webkit-appearance: none; appearance: none; --p: 50%; width: 100%; min-width: 0; height: 28px; margin: 0; background: transparent; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: linear-gradient(to right, var(--teal) var(--p), var(--rule) var(--p)); }
input[type="range"]::-moz-range-track { height: 2px; background: var(--rule); }
input[type="range"]::-moz-range-progress { height: 2px; background: var(--teal); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 9px; height: 17px; margin-top: -8px; background: var(--teal); border: 0; border-radius: 0; box-shadow: 0 0 0 2px var(--panel); }
input[type="range"]::-moz-range-thumb { width: 9px; height: 17px; background: var(--teal); border: 0; border-radius: 0; box-shadow: 0 0 0 2px var(--panel); }
input[type="range"]:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
.btn {
  font-size: 0.75rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; line-height: 1;
  color: var(--text); background: var(--panel-2); border: 1px solid var(--rule);
  padding: 11px 13px; cursor: pointer; transition: border-color 0.15s, color 0.15s, background 0.15s;
}
.btn:hover { border-color: var(--muted); }
.btn:active { background: var(--ink); }
.btn:disabled { color: var(--rule); cursor: default; border-color: var(--rule); }
.btn:focus-visible, .agenda button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.btn.primary { background: var(--teal); border-color: var(--teal); color: var(--ink); }
.btn.primary:hover { border-color: var(--text); }
.btn.quiet { background: transparent; padding: 7px 9px; font-size: 0.6875rem; color: var(--muted); }
.seg { display: flex; }
.seg .btn { background: transparent; color: var(--muted); }
.seg .btn + .btn { border-left: 0; }
.seg .btn[aria-pressed="true"] { color: var(--teal); border-color: var(--teal-deep); background: var(--panel-2); }
.spacer { flex: 1 1 0; }
.fine { margin: 0; font-size: 0.6875rem; line-height: 1.4; color: var(--muted); }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) fit-content(58%); }
  .deck { border-left: 0; border-top: 1px solid var(--rule); padding-block: 10px 10px; gap: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .agenda { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .agenda li + li { border-top: 0; border-left: 1px solid var(--rule); }
  .agenda button { grid-template-columns: minmax(0, 1fr); padding: 7px 2px; text-align: center; font-size: 0.6875rem; }
  .agenda button .n { display: none; }
  .agenda button[aria-current="step"] { box-shadow: inset 0 -2px 0 var(--teal); }
  .script { font-size: 0.8125rem; line-height: 1.42; }
  .sliders { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cell { grid-template-columns: 4.6em minmax(0, 1fr) 3.1em; gap: 6px; }
  .cell label { font-size: 0.75rem; }
  .slidehead { top: 10px; gap: 3px; }
  .eyebrow { margin-top: 2px; font-size: 0.6875rem; }
  .legend { font-size: 0.6875rem; gap: 2px 12px; }
  .brand span:last-child { display: none; }
  .btn { padding: 10px 10px; }
}
@media (prefers-reduced-motion: reduce) {
  .labels, .labels span, .btn, .eyebrow, .slidehead h1, .legend, .script, .speaker { transition: none; }
}
</style>
</head>
<body>

<div class="app">
  <main class="stage" id="stage">
    <canvas id="scene" role="img" aria-label="The current slide's chart, built from blocks of cut stone on dark slate."></canvas>
    <div class="labels" id="labels" aria-hidden="true"></div>
    <header class="slidehead" id="slidehead">
      <p class="brand"><span class="mark" aria-hidden="true"></span><span>Greywether Stone Co.</span><span>Q3 FY2026 earnings call</span></p>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="headline" aria-live="polite"></h1>
      <ul class="legend" id="legend"></ul>
    </header>
    <p class="fallback" id="fallback" hidden>The charts are drawn with WebGL, which this browser could not start. The call's remarks and figures still work in the panel.</p>
  </main>

  <aside class="deck" aria-label="Presenter panel">
    <ol class="agenda" id="agenda">
      <li><button type="button" data-go="0"><span class="n">01</span><span>Highlights</span></button></li>
      <li><button type="button" data-go="1"><span class="n">02</span><span>Segments</span></button></li>
      <li><button type="button" data-go="2"><span class="n">03</span><span>Bridge</span></button></li>
      <li><button type="button" data-go="3"><span class="n">04</span><span>Margin</span></button></li>
      <li><button type="button" data-go="4"><span class="n">05</span><span>Outlook</span></button></li>
    </ol>
    <section class="remarks" id="remarks" aria-label="Prepared remarks">
      <p class="speaker" id="speaker"></p>
      <p class="script" id="script" aria-live="polite"></p>
      <div class="progress" aria-hidden="true"><i id="progress"></i></div>
    </section>
    <section class="figures" aria-label="Figures on this slide">
      <div class="figures-head"><h2>Adjust the figures</h2><button type="button" class="btn quiet" id="reset">Reset</button></div>
      <div class="sliders">
        <div class="cell"><label for="f0" id="l0"></label><input type="range" id="f0"><output for="f0" id="o0"></output></div>
        <div class="cell"><label for="f1" id="l1"></label><input type="range" id="f1"><output for="f1" id="o1"></output></div>
        <div class="cell"><label for="f2" id="l2"></label><input type="range" id="f2"><output for="f2" id="o2"></output></div>
        <div class="cell"><label for="f3" id="l3"></label><input type="range" id="f3"><output for="f3" id="o3"></output></div>
        <div class="cell"><label for="f4" id="l4"></label><input type="range" id="f4"><output for="f4" id="o4"></output></div>
        <div class="cell"><label for="f5" id="l5"></label><input type="range" id="f5"><output for="f5" id="o5"></output></div>
      </div>
    </section>
    <div class="actions">
      <button type="button" class="btn" id="back">Back</button>
      <button type="button" class="btn" id="next">Next</button>
      <button type="button" class="btn primary" id="play">Run the call</button>
      <span class="spacer"></span>
      <div class="seg" role="group" aria-label="Camera">
        <button type="button" class="btn" id="view-chart" aria-pressed="true">Chart</button>
        <button type="button" class="btn" id="view-close" aria-pressed="false">Close-up</button>
      </div>
    </div>
    <p class="fine">Illustrative figures. Greywether Stone Co. is a fictional company.</p>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  var CW = 8.6;                                  // chart width on the slate
  function $(id) { return document.getElementById(id); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function fmtInt(n) { return Math.round(n).toLocaleString('en-US'); }
  function one(n) { return Math.abs(n).toFixed(1); }
  function signed(n, suffix) { return (n >= 0 ? '+' : '−') + Math.abs(n).toFixed(suffix === '%' ? 1 : 0) + (suffix || ''); }
  function dollars(m) { return m >= 1000 ? '$' + (m / 1000).toFixed(2) + ' billion' : '$' + fmtInt(m) + ' million'; }
  function cols(n) { var pitch = CW / n, xs = []; for (var i = 0; i < n; i++) xs.push(-CW / 2 + pitch * (i + 0.5)); return xs; }
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ------------------------------------------------------------------ *
   * The call. Each slide owns its figures and turns them into a chart
   * spec (blocks of stone, connector lines, labels) plus the headline
   * and the speaker's remarks, so every number on screen is live.
   * ------------------------------------------------------------------ */
  var PRIOR_SEG = [742, 518, 428], PRIOR_EBITDA = 372, PRIOR_SPLIT = [64.9, 13.1, 22.0];
  var slides = [
    {
      key: 'highlights', speaker: 'Chief Executive Officer', eyebrow: 'Revenue by quarter · $ millions', yMax: 2000, ticks: [500, 1000, 1500, 2000], tickFmt: fmtInt,
      legend: [['turq', 'This quarter'], ['lime', 'Same quarter last year'], ['granite', 'Other quarters']],
      inputs: [
        { label: 'Q2 FY25', min: 600, max: 2000, step: 1, value: 1612 }, { label: 'Q3 FY25', min: 600, max: 2000, step: 1, value: 1688 },
        { label: 'Q4 FY25', min: 600, max: 2000, step: 1, value: 1594 }, { label: 'Q1 FY26', min: 600, max: 2000, step: 1, value: 1655 },
        { label: 'Q2 FY26', min: 600, max: 2000, step: 1, value: 1771 }, { label: 'Q3 FY26', min: 600, max: 2000, step: 1, value: 1842 }
      ],
      fmt: fmtInt,
      build: function (v) {
        var xs = cols(6), yoy = (v[5] / v[1] - 1) * 100, seq = (v[5] / v[4] - 1) * 100, record = v[5] >= Math.max.apply(null, v);
        return {
          stagger: 0.09, focus: 5,
          blocks: v.map(function (val, i) { return { x: xs[i], w: 0.98, p: 0, q: val, stone: i === 5 ? 'turq' : i === 1 ? 'lime' : 'granite', label: fmtInt(val), cls: i === 5 ? 'hi' : '', lp: 'end', input: i, mode: 'abs' }; }),
          lines: [], notes: [],
          cats: this.inputs.map(function (inp, i) { return { x: xs[i], text: inp.label }; }),
          headline: 'Revenue of <b>$' + fmtInt(v[5]) + 'M</b>, <b>' + (yoy >= 0 ? 'up ' : 'down ') + one(yoy) + '%</b> from a year ago',
          script: 'Good morning, and thank you for joining us. Third-quarter revenue was <b>' + dollars(v[5]) + '</b>, <b>' + (yoy >= 0 ? 'up ' : 'down ') + one(yoy) + '%</b> from the same quarter last year' +
            (record ? ' and the highest quarter in our history' : '') + '. Against the second quarter, revenue ' + (seq >= 0 ? 'rose ' : 'fell ') + '<b>' + one(seq) + '%</b>.'
        };
      }
    },
    {
      key: 'segments', speaker: 'Chief Executive Officer', eyebrow: 'Revenue by segment, third quarter · $ millions', yMax: 1000, ticks: [250, 500, 750, 1000], tickFmt: fmtInt,
      legend: [['turq', 'Q3 FY26'], ['granite', 'Q3 FY25']],
      inputs: [
        { label: 'Aggregates', min: 200, max: 1000, step: 1, value: 801 },
        { label: 'Dimension', min: 200, max: 1000, step: 1, value: 566 },
        { label: 'Engineered', min: 200, max: 1000, step: 1, value: 475 }
      ],
      fmt: fmtInt,
      build: function (v) {
        var xs = cols(3), names = ['Aggregates', 'Dimension Stone', 'Engineered Surfaces'], blocks = [], notes = [], g = [], best = 0, grew = 0;
        for (var i = 0; i < 3; i++) {
          g.push((v[i] / PRIOR_SEG[i] - 1) * 100);
          if (g[i] > g[best]) best = i;
          if (g[i] > 0) grew++;
          blocks.push({ x: xs[i] - 0.53, w: 0.96, p: 0, q: PRIOR_SEG[i], stone: 'granite', label: fmtInt(PRIOR_SEG[i]), lp: 'end' });
          blocks.push({ x: xs[i] + 0.53, w: 0.96, p: 0, q: v[i], stone: 'turq', label: fmtInt(v[i]), cls: 'hi', lp: 'end', input: i, mode: 'abs' });
          notes.push({ x: xs[i], v: Math.max(v[i], PRIOR_SEG[i]) + 135, text: signed(g[i], '%'), cls: g[i] >= 0 ? 'hi' : 'neg' });
        }
        var total = v[0] + v[1] + v[2];
        function verb(x) { return (x >= 0 ? 'rose ' : 'fell ') + one(x) + '%'; }
        return {
          stagger: 0.1, focus: best * 2 + 1, blocks: blocks, lines: [], notes: notes,
          cats: names.map(function (t, i2) { return { x: xs[i2], text: t }; }),
          headline: (grew === 3 ? 'All three segments grew' : grew === 0 ? 'No segment grew' : (grew === 1 ? 'One' : 'Two') + ' of three segments grew') + '; <b>' + names[best] + '</b> led at <b>' + signed(g[best], '%') + '</b>',
          script: (grew === 3 ? 'Growth was broad. ' : 'Results were mixed. ') + 'Aggregates revenue ' + verb(g[0]) + ', Dimension Stone ' + verb(g[1]) + ', and Engineered Surfaces ' + verb(g[2]) +
            '. Together, the three segments delivered <b>' + dollars(total) + '</b>.'
        };
      }
    },
    {
      key: 'bridge', speaker: 'Chief Financial Officer', eyebrow: 'Adjusted EBITDA, Q3 FY25 to Q3 FY26 · $ millions', yMax: 600, ticks: [150, 300, 450, 600], tickFmt: fmtInt,
      legend: [['turq', 'Increase, and this quarter'], ['rust', 'Decrease'], ['granite', 'Last year']],
      inputs: [
        { label: 'Volume', min: -60, max: 60, step: 1, value: 38 }, { label: 'Price & mix', min: -60, max: 60, step: 1, value: 57 },
        { label: 'Input costs', min: -60, max: 60, step: 1, value: -41 }, { label: 'Savings', min: -60, max: 60, step: 1, value: 29 },
        { label: 'Currency', min: -60, max: 60, step: 1, value: -9 }
      ],
      fmt: function (n) { return signed(n); },
      build: function (v) {
        var xs = cols(7), w = 0.88, run = PRIOR_EBITDA, up = 0, down = 0, blocks = [], lines = [];
        var names = ['Q3 FY25', 'Volume', 'Price<br>& mix', 'Input<br>costs', 'Savings', 'FX', 'Q3 FY26'];
        blocks.push({ x: xs[0], w: w, p: 0, q: run, stone: 'granite', label: fmtInt(run), lp: 'end' });
        for (var i = 0; i < 5; i++) {
          lines.push({ x0: xs[i] - w / 2, x1: xs[i + 1] + w / 2, v: run });
          blocks.push({ x: xs[i + 1], w: w, p: run, q: run + v[i], stone: v[i] >= 0 ? 'turq' : 'rust', label: signed(v[i]), cls: v[i] >= 0 ? 'hi' : 'neg', lp: 'end', input: i, mode: 'delta' });
          if (v[i] >= 0) up += v[i]; else down -= v[i];
          run += v[i];
        }
        lines.push({ x0: xs[5] - w / 2, x1: xs[6] + w / 2, v: run });
        blocks.push({ x: xs[6], w: w, p: 0, q: run, stone: 'turq', label: fmtInt(run), cls: 'hi', lp: 'end' });
        var chg = (run / PRIOR_EBITDA - 1) * 100;

    }
    function stepBlocks(dt) {

        if (!(Math.abs(B.f.x - B.p.x) < 0.02 && Math.abs(B.s.x - B.p.x) < 0.02)) allClosed = false;
        if (B.dirty || p0 !== B.p.x || f0 !== B.f.x || s0 !== B.s.x || m0 !== B.m) { updateBlock(k); B.dirty = false; moved = true; }
      }
      damp(lineK, phase === 'out' ? 0 : 1, reduceMotion ? 0.0001 : 0.18, Infinity, dt);
      for (var j = 0; j < NL; j++) {
        var L = fins[j], h = 0.045 * lineK.x;
        if (phase !== 'out') damp(L.d, L.T, ST, spd, dt);
        L.mesh.visible = L.on && h > 0.004;
        if (L.mesh.visible) { L.mesh.position.set((L.x0 + L.x1) / 2, h / 2, -L.d.x); L.mesh.scale.set(L.x1 - L.x0 + 0.02, h, 0.022); }
      }
      for (var n = 0; n < notes.length; n++) if (notes[n].on && phase !== 'out') damp(notes[n].d, notes[n].T, ST, spd, dt);
      for (var g = 0; g < grids.length; g++) grids[g].scale.set(Math.max(0.001, (CW + 0.5) * lineK.x), 0.014, 1);
      if (lineK.x > 0.002 && lineK.x < 0.998) moved = true;
      if (phase === 'out' && allClosed && lineK.x < 0.03) {
        curKey = pending.key; yMax = pending.yMax;
        applyTargets(pending, true);
        setFocus(pending.focus || 0);
        pending = null; phase = 'in'; inClock = 0; labelsEl.classList.remove('swap');
        hooks.onSwap();
        moved = true;
      } else if (phase === 'in' && !holds) phase = 'idle';
      if (moved) {
        for (var i = 0; i < meshes.length; i++) meshes[i].instanceMatrix.needsUpdate = true;
        renderer.shadowMap.needsUpdate = true;
      }
      settled = phase === 'idle' && !moved;
      return moved;
    }

    /* ---------- camera: the framed slide, and a low close-up that follows one block's value edge ---------- */
    var view = 'chart', time = 0;
    var cam = { px: { x: 0, v: 0 }, py: { x: 12, v: 0 }, pz: { x: 12, v: 0 }, tx: { x: 0, v: 0 }, ty: { x: 0, v: 0 }, tz: { x: -3, v: 0 }, fov: { x: 30, v: 0 }, ap: { x: 0.02, v: 0 }, mb: { x: 0.004, v: 0 } };
    var chartPose = { pos: new T.Vector3(), target: new T.Vector3() }, camReady = false, topInset = 0.3;
    var fitPts = [];
    (function () {
      var xl = -CW / 2 - 1.05, xr = CW / 2 + 0.55;
      [[xl, 0, 1.0], [xr, 0, 1.0], [xl, HB, -LMAX - 0.7], [xr, HB, -LMAX - 0.7], [xl, 0, -LMAX - 0.7], [xr, 0, -LMAX - 0.7]].forEach(function (p) { fitPts.push(new T.Vector3(p[0], p[1], p[2])); });
    })();
    function frameChart() {
      var aspect = sw / sh, el = lerp(70, 46, smooth((aspect - 0.55) / 1.1)) * Math.PI / 180;

    function stepCamera(dt) {
      var drift = reduceMotion ? 0 : Math.sin(time * 0.11) * 0.045;
      if (view === 'chart') {                       // square-on and still: the slide is read, not toured

        want.pos.copy(chartPose.pos);

        want.target.set(B.xc, 0.12, tipZ + 0.25);
        want.pos.set(B.xc + (cx * ca + cz * sa) * k, 0.82 * k, tipZ + (-cx * sa + cz * ca) * k);
        want.fov = 27; want.ap = 0.05; want.mb = 0.016;
      }

      damp(cam.px, want.pos.x, st, Infinity, dt); damp(cam.py, want.pos.y, st, Infinity, dt); damp(cam.pz, want.pos.z, st, Infinity, dt);
      damp(cam.tx, want.target.x, st, Infinity, dt); damp(cam.ty, want.target.y, st, Infinity, dt); damp(cam.tz, want.target.z, st, Infinity, dt);
      damp(cam.fov, want.fov, st, Infinity, dt); damp(cam.ap, want.ap, st, Infinity, dt); damp(cam.mb, want.mb, st, Infinity, dt);
      camera.position.set(cam.px.x, cam.py.x, cam.pz.x);
      camera.lookAt(cam.tx.x, cam.ty.x, cam.tz.x);

      camera.updateMatrixWorld();

    }

      lensMat.uniforms.uTime.value = reduceMotion ? 0 : time;

      renderer.render(scene, camera);

    renderer.shadowMap.needsUpdate = true;

    return {
      show: show,
      setView: function (v) { view = v; labelsEl.classList.toggle('close', v === 'close'); },
      lockScale: function (s) { lockedScale = true; resScale = s; resize(true); },
      blocks: blocks,
      info: function () { return { phase: phase, settled: settled, key: curKey, frames: frames, stones: total, scale: resScale, buf: [bufW, bufH], lite: lite, view: view, focus: focusBlock, lmax: LMAX, yMax: yMax }; },

})();
